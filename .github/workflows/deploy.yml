name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package.json

      - name: Install dependencies
        run: cd app && npm ci

      - name: Build app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_AI_ASSISTANT_FUNCTION_NAME: ai-assistant-chat
        run: cd app && npm run build

      - name: Prepare deploy directory
        run: |
          echo "=== app/dist contents ==="
          ls -la app/dist/ || echo "DIST DIR MISSING"
          ls -la app/dist/assets/ || echo "DIST ASSETS MISSING"
          echo "=== dist/index.html first line ==="
          head -5 app/dist/index.html || echo "DIST INDEX.HTML MISSING"

          mkdir -p deploy/app
          # Marketing site files
          cp index.html deploy/
          cp CNAME deploy/ 2>/dev/null || true
          cp robots.txt deploy/ 2>/dev/null || true
          cp favicon.ico deploy/ 2>/dev/null || true
          cp -r src deploy/ 2>/dev/null || true
          cp -r assets deploy/ 2>/dev/null || true
          cp -r docs deploy/ 2>/dev/null || true
          # React SPA (built output)
          cp -r app/dist/. deploy/app/
          # 404 fallback for SPA deep-link routing
          cp deploy/app/index.html deploy/app/404.html

          echo "=== deploy/app contents ==="
          ls -la deploy/app/
          echo "=== deploy/app/index.html ==="
          cat deploy/app/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
